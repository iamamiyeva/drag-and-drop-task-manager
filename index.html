<!DOCTYPE html>
<html lang="en">
<head>
    <title>Drag and Drop File</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Task Manager</h1>
    <div class="container">
        <div class="task-version">
            <h3>Available Tasks</h3>
            <div id="left">
                <div class="list" draggable="true"><img src="drag.png"> Reading</div>
                <div class="list" draggable="true"><img src="drag.png"> Studying</div>
                <div class="list" draggable="true"><img src="drag.png"> Doing sport</div>
                <div class="list" draggable="true"><img src="drag.png"> Watching</div>
            </div>
        </div>
        <div class="task-version">
            <h3>Completed Tasks</h3>
            <div id="right">
            </div>
        </div>        
    </div>

    <script>

  
        let lists = document.getElementsByClassName("list");
        let rightBox = document.getElementById("right");
        let leftBox = document.getElementById("left");
        let selected = null;

        for (let list of lists) {
            list.addEventListener("dragstart", function() {
                selected = this;
            });
        }

        rightBox.addEventListener("dragover", function(e) {
            e.preventDefault();
        });

        rightBox.addEventListener("drop", function(e) {
            e.preventDefault();
            if (selected) {
                rightBox.appendChild(selected);
                selected = null;
            }
        });

        leftBox.addEventListener("dragover", function(e) {
            e.preventDefault();
        });

        leftBox.addEventListener("drop", function(e) {
            e.preventDefault();
            if (selected) {
                leftBox.appendChild(selected);
                selected = null;
            }
        });

    </script>
</body>
</html>
